version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# LeadRadar — Docker Compose para ejecución local
#
# Uso:
#   1. cp env.example .env  (y edita las variables)
#   2. docker compose up -d
#   3. Abre http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Base de datos MySQL ────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: leadradar
      MYSQL_USER: leadradar
      MYSQL_PASSWORD: leadradar_pass
    ports:
      - "3306:3306"
    volumes:
      - leadradar_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "leadradar", "-pleadaradar_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación LeadRadar ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOCAL_AUTH: "true"
      LOCAL_ADMIN_USER: ${LOCAL_ADMIN_USER:-admin}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-leadradar2024}
      LOCAL_ADMIN_PASSWORD_HASH: ${LOCAL_ADMIN_PASSWORD_HASH:-}
      DATABASE_URL: mysql://leadradar:leadradar_pass@db:3306/leadradar
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-una-clave-secreta-larga}
      PORT: "3000"
      # Variables de Manus (vacías en modo local)
      VITE_APP_ID: ""
      OAUTH_SERVER_URL: ""
      VITE_OAUTH_PORTAL_URL: ""
      OWNER_OPEN_ID: ""
      OWNER_NAME: ""
      BUILT_IN_FORGE_API_URL: ""
      BUILT_IN_FORGE_API_KEY: ""
      VITE_FRONTEND_FORGE_API_KEY: ""
      VITE_FRONTEND_FORGE_API_URL: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - leadradar_uploads:/app/uploads

volumes:
  leadradar_db:
  leadradar_uploads:
